const AUTH_KEY = "trip_planner_atl_auth_v4";
const CACHE_PREFIX = "trip_planner_atl_cache_v4";
function makeBrowserUid(){try{return `b-${crypto.randomUUID().slice(0,8)}`;}catch{return `b-${Math.random().toString(36).slice(2,10)}`;}}
function loadAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||"{}");}catch{return {};} }
function saveAuth(auth){try{localStorage.setItem(AUTH_KEY,JSON.stringify(auth));}catch{}}
function loadCache(uid){try{return JSON.parse(localStorage.getItem(`${CACHE_PREFIX}:${uid}`)||"null");}catch{return null;}}
function saveCache(uid,state){try{localStorage.setItem(`${CACHE_PREFIX}:${uid}`,JSON.stringify(state));}catch{}}

// ─── Shared Components ───
function ThemeTag({theme}){const t=THEMES[theme];if(!t)return null;return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${t.bg} ${t.text} ${t.border} border`}>{t.icon} {t.label}</span>}

function ProximityBadge({value}){const c=value>=90?"text-emerald-400":value>=70?"text-amber-400":"text-orange-400";return <span className={`text-xs font-bold ${c}`}>📍 {value}%</span>}

function InterestBadge({value}){const c=value>=9?"text-red-400":value>=7?"text-orange-400":value>=5?"text-amber-400":"text-slate-400";return <span className={`text-xs font-bold ${c}`}>🔥 {value}/10</span>}

function TypeBadge({type}){const m={keynote:"bg-red-500/20 text-red-300 border-red-500/30",presentation:"bg-blue-500/20 text-blue-300 border-blue-500/30",panel:"bg-purple-500/20 text-purple-300 border-purple-500/30",networking:"bg-green-500/20 text-green-300 border-green-500/30",sponsor:"bg-gray-600/20 text-gray-400 border-gray-500/30"};return <span className={`inline-flex px-2 py-0.5 rounded-full text-xs font-semibold capitalize border ${m[type]||m.presentation}`}>{type}</span>}

function PriceTag({price}){const f=price.length,e=3-f;return <span className="font-mono text-sm"><span className="text-amber-400">{price}</span><span className="text-slate-700">{"$".repeat(Math.max(0,e))}</span></span>}

function DayPicker({onSelect,label}){

    {open&&<div className="absolute z-30 mt-1 right-0 bg-slate-800 border border-slate-600 rounded-lg shadow-xl p-1 min-w-48">{DAYS.map((d,i)=><button key={i} onClick={()=>{onSelect(i);setOpen(false)}} className="w-full text-left px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-700 rounded transition-colors"><span className="font-medium text-white">{d.date}</span> — {d.title}</button>)}<button onClick={()=>setOpen(false)} className="w-full text-left px-3 py-1.5 text-xs text-slate-500 hover:bg-slate-700 rounded">Cancel</button></div>}
  </div>
}

function Petals(){

  return <>{petals.map(p=><div key={p.id} className="petal" style={{left:`${p.left}%`,top:'100vh',animationDelay:`${p.delay}s`,animationDuration:`${p.dur}s`,fontSize:`${p.size}rem`,opacity:0.3}}>🍑</div>)}</>
}

  return <div className="mb-5 bg-slate-800/70 rounded-2xl border border-slate-700/40 p-4 space-y-3">
    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>

      </div>

      <input value={joinUid} onChange={e=>setJoinUid(e.target.value)} placeholder="Join another session UID" className="w-full bg-slate-900/70 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 border border-slate-600 focus:border-orange-500 outline-none"/>
      <input value={joinPass} onChange={e=>setJoinPass(e.target.value)} type="password" placeholder="Join passphrase" className="w-full bg-slate-900/70 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 border border-slate-600 focus:border-orange-500 outline-none"/>
    </div>
    <div className="flex flex-wrap gap-2">
      <button onClick={onLockSession} className="px-3 py-1.5 rounded-lg bg-orange-500/20 text-orange-300 text-xs font-medium hover:bg-orange-500/30 border border-orange-500/30 transition-colors">Save / lock pass</button>
      <button onClick={onJoin} className="px-3 py-1.5 rounded-lg bg-sky-500/20 text-sky-300 text-xs font-medium hover:bg-sky-500/30 border border-sky-500/30 transition-colors">Join session</button>
    </div>
    <p className="text-[11px] text-slate-500">Share the UID + passphrase with teammates. Same browser auto-loads; incognito/browser switches can join with the same UID and passphrase.</p>

// ─── App ───
function App(){
  // Session model (kept intentionally simple):
  // - each browser gets a UID stored in localStorage
  // - same browser also stores the passphrase locally for auto-load convenience
  // - server persistence only kicks in after a session is saved/locked with a passphrase
  const authRef=useRef(loadAuth());
  const initialBrowserUid=authRef.current.uid||makeBrowserUid();
  const initialPass=authRef.current.passphrase||"";
  const initialState=loadCache(initialBrowserUid)||null;
  const clientIdRef=useRef(Math.random().toString(36).slice(2));

  const [tab,setTab]=useState("itinerary");
  const [browserUid,setBrowserUid]=useState(initialBrowserUid);
  const [passphrase,setPassphrase]=useState(initialPass);
  const [joinUid,setJoinUid]=useState("");
  const [joinPass,setJoinPass]=useState("");
  const [syncStatus,setSyncStatus]=useState('local only');
  const [sessionHydrated,setSessionHydrated]=useState(false);

  // Core planner state always starts from local cache for fast, predictable load.
  const [selections,setSelections]=useState(initialState?.selections||DAYS.map(()=>0));
  const [dayPins,setDayPins]=useState(initialState?.dayPins||INITIAL_PINS);
  const [food,setFood]=useState(initialState?.food||INITIAL_FOOD);
  const [library,setLibrary]=useState(initialState?.library||INITIAL_LIBRARY);
  const [conference,setConference]=useState(initialState?.conference||INITIAL_CONFERENCE);
  const [reminders,setReminders]=useState(initialState?.reminders||INITIAL_REMINDERS);
  const [newReminder,setNewReminder]=useState("");
  const [dayItemOrder,setDayItemOrder]=useState(initialState?.dayItemOrder||{});
  const [hiddenActivities,setHiddenActivities]=useState(initialState?.hiddenActivities||{});

  function buildPlannerState(){
    return {selections,dayPins,food,library,conference,reminders,dayItemOrder,hiddenActivities};
  }

  // Centralized apply helper so loads and live updates all go through one path.
  function applyPlannerState(s){
    if(!s)return;
    if(s.selections)setSelections(s.selections);
    if(s.dayPins)setDayPins(s.dayPins);
    if(s.food)setFood(s.food);
    if(s.library)setLibrary(s.library);
    if(s.conference)setConference(s.conference);
    if(s.reminders)setReminders(s.reminders);
    if(s.dayItemOrder)setDayItemOrder(s.dayItemOrder);
    if(s.hiddenActivities)setHiddenActivities(s.hiddenActivities);
  }

  // Always keep this browser's current working copy cached locally.
  useEffect(()=>{
    saveAuth({uid:browserUid,passphrase});
  },[browserUid,passphrase]);

  useEffect(()=>{
    saveCache(browserUid,buildPlannerState());
  },[browserUid,selections,dayPins,food,library,conference,reminders,dayItemOrder,hiddenActivities]);

  // On startup / session switch, try to hydrate from the server if we have a passphrase.
  useEffect(()=>{
    let cancelled=false;
    async function hydrateSession(){
      setSessionHydrated(false);
      const cached=loadCache(browserUid);
      if(cached) applyPlannerState(cached);

      if(!passphrase){
        setSyncStatus('local only');
        setSessionHydrated(true);
        return;
      }

      setSyncStatus('loading session…');
      try{
        const params=new URLSearchParams({uid:browserUid,pass:passphrase});
        const res=await fetch(BASE_PATH+`/api/session?${params.toString()}`);
        const data=await res.json();
        if(cancelled)return;
        if(res.ok&&data.session?.state){
          applyPlannerState(data.session.state);
          saveCache(browserUid,data.session.state);
          setSyncStatus('connected');
        }else if(res.ok){
          setSyncStatus('ready to save');
        }else{
          setSyncStatus(data.error||'session load failed');
        }
      }catch{
        if(!cancelled)setSyncStatus('offline / local cache');
      }finally{
        if(!cancelled)setSessionHydrated(true);
      }
    }
    hydrateSession();
    return()=>{cancelled=true};
  },[browserUid,passphrase]);

  const pinToDay=(di,id)=>setDayPins(p=>{const n={...p};const e=[...(n[di]||[])];if(!e.includes(id))e.push(id);n[di]=e;return n});
  const removePin=(di,id)=>{setDayPins(p=>{const n={...p};n[di]=(n[di]||[]).filter(x=>x!==id);return n});setDayItemOrder(p=>{const n={...p};if(n[di])n[di]=n[di].filter(k=>k!==id);return n})};
  const totalPins=Object.values(dayPins).reduce((s,a)=>s+a.length,0);

  const allItems=useMemo(()=>{const m={};[...food,...library,...conference].forEach(x=>{m[x.id]=x});return m},[food,library,conference]);

  const hideActivity=(di,key)=>setHiddenActivities(p=>{const n={...p};const s=new Set(n[di]||[]);s.add(key);n[di]=[...s];return n});
  const restoreActivity=(di,key)=>setHiddenActivities(p=>{const n={...p};n[di]=(n[di]||[]).filter(k=>k!==key);return n});

  const getDayDisplayItems=useCallback((di)=>{
    const opt=DAYS[di].options[selections[di]]||DAYS[di].options[0];
    const hidden=new Set(hiddenActivities[di]||[]);
    const actKeys=opt.activities.map((_,idx)=>'act-'+idx).filter(k=>!hidden.has(k));
    const pinIds=(dayPins[di]||[]).filter(id=>allItems[id]);
    const allKeys=[...actKeys,...pinIds];
    const stored=dayItemOrder[di]||[];
    const valid=stored.filter(k=>allKeys.includes(k));
    const remaining=allKeys.filter(k=>!valid.includes(k));
    const order=[...valid,...remaining];
    const itemMap={};
    opt.activities.forEach((a,idx)=>{itemMap['act-'+idx]={type:'act',key:'act-'+idx,...a}});
    pinIds.forEach(id=>{const p=allItems[id];if(p)itemMap[id]={type:'pin',key:id,...p}});
    return order.map(k=>itemMap[k]).filter(Boolean);
  },[selections,dayPins,allItems,dayItemOrder,hiddenActivities]);

  const getHiddenItems=useCallback((di)=>{
    const opt=DAYS[di].options[selections[di]]||DAYS[di].options[0];
    const hidden=hiddenActivities[di]||[];
    return hidden.map(k=>{const idx=parseInt(k.replace('act-',''));return opt.activities[idx]?{key:k,...opt.activities[idx]}:null}).filter(Boolean);
  },[selections,hiddenActivities]);

  const moveItem=(di,key,direction)=>{
    const items=getDayDisplayItems(di);
    const order=items.map(it=>it.key);
    const idx=order.indexOf(key);
    const newIdx=idx+direction;
    if(idx<0||newIdx<0||newIdx>=order.length)return;
    const newOrder=[...order];
    [newOrder[idx],newOrder[newIdx]]=[newOrder[newIdx],newOrder[idx]];
    setDayItemOrder(p=>({...p,[di]:newOrder}));
  };

  // Join the Socket.IO room for the active planner session.
  useEffect(()=>{
    if(!browserUid)return;
    socket.emit('join-session',{uid:browserUid});
  },[browserUid]);

  // Autosave only after the session has been hydrated and a passphrase exists.
  // This avoids clobbering server state during first paint.
  useEffect(()=>{
    if(!sessionHydrated||!passphrase)return;
    const state=buildPlannerState();
    const timer=setTimeout(async()=>{
      try{
        await fetch(BASE_PATH+'/api/session',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({uid:browserUid,pass:passphrase,state,clientId:clientIdRef.current})
        });
        setSyncStatus('connected');
      }catch{
        setSyncStatus('offline / local cache');
      }
    },350);
    return()=>clearTimeout(timer);
  },[sessionHydrated,browserUid,passphrase,selections,dayPins,food,library,conference,reminders,dayItemOrder,hiddenActivities]);

  // Listen for remote edits from teammates using the same session UID.
  useEffect(()=>{
    const onConnect=()=>setSyncStatus(passphrase?'connected':'local only');
    const onDisconnect=()=>setSyncStatus('offline / local cache');
    const onUpdate=({uid,state,from})=>{
      if(uid!==browserUid||from===clientIdRef.current||!state)return;
      applyPlannerState(state);
      saveCache(browserUid,state);
      setSyncStatus('updated from teammate');
    };
    socket.on('connect',onConnect);
    socket.on('disconnect',onDisconnect);
    socket.on('state-updated',onUpdate);
    return()=>{
      socket.off('connect',onConnect);
      socket.off('disconnect',onDisconnect);
      socket.off('state-updated',onUpdate);
    };
  },[browserUid,passphrase]);

  async function lockCurrentSession(){
    if(!passphrase.trim()){
      alert('Add a passphrase first so this session can be re-opened and shared.');
      return;
    }
    try{
      const state=buildPlannerState();
      const res=await fetch(BASE_PATH+'/api/session',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({uid:browserUid,pass:passphrase,state,clientId:clientIdRef.current})
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'Failed to save session');
      saveAuth({uid:browserUid,passphrase});
      saveCache(browserUid,state);
      setSyncStatus('saved + shareable');
      alert(`Session saved. Share this UID: ${browserUid}`);
    }catch(err){
      alert(err.message||'Failed to save session');
    }
  }

  async function joinExistingSession(){
    const uid=joinUid.trim();
    if(!uid||!joinPass.trim()){
      alert('Enter the shared UID and passphrase.');
      return;
    }
    try{
      const params=new URLSearchParams({uid,pass:joinPass});
      const res=await fetch(BASE_PATH+`/api/session?${params.toString()}`);
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'Failed to join session');
      if(!data.session?.state)throw new Error('Session not found');
      applyPlannerState(data.session.state);
      saveCache(uid,data.session.state);
      setBrowserUid(uid);
      setPassphrase(joinPass);
      setJoinUid('');
      setJoinPass('');
      setSyncStatus('connected');
    }catch(err){
      alert(err.message||'Failed to join session');
    }
  }

  async function copyUid(){
    try{
      await navigator.clipboard.writeText(browserUid);
      setSyncStatus('uid copied');
    }catch{
      alert(`Copy this UID manually: ${browserUid}`);
    }
  }

  function startFreshSession(){
    const uid=makeBrowserUid();
    setBrowserUid(uid);
    setPassphrase('');
    setJoinUid('');
    setJoinPass('');
    setSyncStatus('local only');
    const cached=loadCache(uid);
    if(cached)applyPlannerState(cached);
    else applyPlannerState({selections:DAYS.map(()=>0),dayPins:INITIAL_PINS,food:INITIAL_FOOD,library:INITIAL_LIBRARY,conference:INITIAL_CONFERENCE,reminders:INITIAL_REMINDERS,dayItemOrder:{},hiddenActivities:{}});
  }

  return <div className="min-h-screen bg-[#0c0c1a] text-white relative">
    <Petals/>
    <div className="max-w-3xl mx-auto px-4 py-8 relative z-10">
      <div className="text-center mb-6">
        <h1 className="text-3xl font-bold bg-gradient-to-r from-orange-400 via-amber-300 to-red-400 bg-clip-text text-transparent">🍑 Atlanta Getaway</h1>
        <p className="text-slate-400 mt-1">4 days · Canopy by Hilton Midtown · UX360 Summit</p>
        <p className="text-sm text-slate-500 mt-1">Apr 21 – Apr 24, 2026</p>
        <p className="text-xs text-slate-500 mt-2">🏨 Canopy by Hilton Atlanta Midtown · ✈️ Arrive Tue 7:20pm · Depart Fri 8:35pm</p>
      </div>

      <SessionBar
        browserUid={browserUid}
        passphrase={passphrase}
        setPassphrase={setPassphrase}
        joinUid={joinUid}
        setJoinUid={setJoinUid}
        joinPass={joinPass}
        setJoinPass={setJoinPass}
        syncStatus={syncStatus}
        onCopyUid={copyUid}
        onJoin={joinExistingSession}
        onNewSession={startFreshSession}
        onLockSession={lockCurrentSession}
      />

      <div className="flex gap-1 mb-6 bg-slate-800/60 rounded-xl p-1 border border-slate-700/40">
        {[{id:"itinerary",label:"Itinerary",icon:"📍"},{id:"library",label:"Activities",icon:"🥾",count:library.length},{id:"food",label:"Food Guide",icon:"🍗",count:food.length},{id:"conference",label:"Conference",icon:"🎤",count:conference.length}].map(t=>
          <button key={t.id} onClick={()=>setTab(t.id)} className={`flex-1 px-2 py-2.5 rounded-lg text-sm font-medium transition-all ${tab===t.id?"bg-slate-700 text-white shadow":"text-slate-400 hover:text-slate-300"}`}>{t.icon} {t.label}{t.count!=null&&<span className="ml-1 text-xs text-slate-500">({t.count})</span>}</button>
        )}
      </div>

      {totalPins>0&&tab!=="itinerary"&&<div className="mb-4 bg-orange-500/10 rounded-lg px-4 py-2 border border-orange-500/20 text-xs text-orange-300">📌 {totalPins} item{totalPins!==1?"s":""} pinned. Switch to Itinerary to see them on each day.</div>}

      {tab==="itinerary"&&<ItineraryTab selections={selections} setSelections={setSelections} dayPins={dayPins} removePin={removePin} allItems={allItems} getDayDisplayItems={getDayDisplayItems} moveItem={moveItem} hideActivity={hideActivity} restoreActivity={restoreActivity} getHiddenItems={getHiddenItems} reminders={reminders} setReminders={setReminders} newReminder={newReminder} setNewReminder={setNewReminder}/>}
      {tab==="library"&&<LibraryTab library={library} setLibrary={setLibrary} pinToDay={pinToDay} dayPins={dayPins}/>}
      {tab==="food"&&<FoodTab food={food} setFood={setFood} pinToDay={pinToDay} dayPins={dayPins}/>}
      {tab==="conference"&&<ConferenceTab conference={conference} setConference={setConference} pinToDay={pinToDay} removePin={removePin} dayPins={dayPins}/>}
    </div>
  </div>
}

// ─── Itinerary Tab ───
function DayCalendarView({displayItems,dayIndex,moveItem,removePin,hideActivity}){
  const hours=[];for(let h=7;h<=23;h++)hours.push(h);
  const parseTime=(t)=>{if(!t)return null;const m=t.match(/^(\d{1,2}):(\d{2})/);if(!m)return null;return parseInt(m[1])+parseInt(m[2])/60};
  const parseEndTime=(t)=>{if(!t)return null;const m=t.match(/(\d{1,2}):(\d{2})$/);if(!m)return null;return parseInt(m[1])+parseInt(m[2])/60};
  const placed=[];const unplaced=[];
  displayItems.forEach((item,idx)=>{
    const start=parseTime(item.time);
    if(start!==null){const end=parseEndTime(item.time)||start+0.5;placed.push({...item,idx,start,end:Math.max(end,start+0.5)})}
    else{unplaced.push({...item,idx})}
  });

  // Column assignment — greedy left-to-right
  const sorted=[...placed].sort((a,b)=>a.start-b.start||a.end-b.end);
  const cols=[];
  sorted.forEach(ev=>{
    let placed=false;
    for(let c=0;c<cols.length;c++){
      if(cols[c]<=ev.start){cols[c]=ev.end;ev.col=c;placed=true;break}
    }
    if(!placed){ev.col=cols.length;cols.push(ev.end)}
  });
  // Expand groups: find max columns for each overlapping cluster
  const totalCols=cols.length||1;
  // Build overlap groups to determine per-group column count
  const groups=[];
  sorted.forEach(ev=>{
    let found=false;
    for(const g of groups){
      if(ev.start<g.end){g.end=Math.max(g.end,ev.end);g.items.push(ev);g.maxCol=Math.max(g.maxCol,ev.col+1);found=true;break}
    }
    if(!found)groups.push({start:ev.start,end:ev.end,items:[ev],maxCol:ev.col+1});
  });
  // Assign group column counts back to events
  const evColCount=new Map();
  groups.forEach(g=>{g.items.forEach(ev=>evColCount.set(ev.key,g.maxCol))});

  const SLOT_H=60;
  const GAP=3;
  return <div>
    <div className="relative flex" style={{minHeight:hours.length*SLOT_H}}>
      <div className="flex-shrink-0 w-12 relative">
        {hours.map(h=><div key={h} className="absolute w-full text-right pr-2" style={{top:(h-7)*SLOT_H-6}}>
          <span className="text-[10px] font-mono text-slate-600">{h===0?'12am':h<12?h+'am':h===12?'12pm':(h-12)+'pm'}</span>
        </div>)}
      </div>
      <div className="flex-1 relative" style={{height:hours.length*SLOT_H}}>
        {hours.map(h=><div key={h} className="absolute w-full border-t border-slate-700/30" style={{top:(h-7)*SLOT_H,height:SLOT_H}}/>)}
        {sorted.map(item=>{
          const isPinned=item.type==='pin';
          const isConfItem=isPinned&&item.themes?.includes("conference");
          const top=(item.start-7)*SLOT_H;
          const height=Math.max((item.end-item.start)*SLOT_H,36);
          const numCols=evColCount.get(item.key)||1;
          const colW=100/numCols;
          const left=item.col*colW;
          return <div key={item.key} className={`absolute rounded-lg px-2.5 py-1.5 border overflow-hidden group/cal ${isPinned?(isConfItem?"bg-red-500/10 border-red-500/30":"bg-orange-500/10 border-orange-500/30"):"bg-slate-700/60 border-slate-600/40"}`} style={{top,height,left:left+'%',width:`calc(${colW}% - ${GAP}px)`}}>
            <div className="flex items-start gap-1.5 h-full">
              <div className="flex-1 min-w-0 overflow-hidden">
                <div className="flex items-center gap-1 flex-wrap"><span className="text-[10px] font-mono text-slate-500 flex-shrink-0">{item.time}</span><span className={`text-xs font-medium text-white ${height<50?"truncate":""}`}>{item.name}</span>{isPinned&&<span className="text-[9px] text-orange-400 font-medium px-1 rounded bg-orange-500/10 border border-orange-500/20 flex-shrink-0">PIN</span>}</div>
                {height>=50&&<div className="text-[10px] text-slate-400 mt-0.5 line-clamp-2">{item.desc}</div>}
                {height>=72&&(item.themes||[]).length>0&&<div className="flex gap-1 mt-1 flex-wrap">{(item.themes||[]).map(t=><ThemeTag key={t} theme={t}/>)}</div>}
              </div>
              <button onClick={()=>isPinned?removePin(dayIndex,item.key):hideActivity(dayIndex,item.key)} className="opacity-0 group-hover/cal:opacity-100 text-slate-500 hover:text-red-400 transition-all flex-shrink-0 text-xs" title="Remove">🗑</button>
            </div>
          </div>
        })}
      </div>
    </div>
    {unplaced.length>0&&<div className="mt-3 pt-3 border-t border-dashed border-slate-700/50"><div className="text-xs text-slate-500 mb-2">📌 Unscheduled items</div><div className="space-y-1.5">{unplaced.map(item=>{
      const isPinned=item.type==='pin';
      const isConfItem=isPinned&&item.themes?.includes("conference");
      return <div key={item.key} className={`flex items-center gap-2 rounded-lg px-3 py-2 border group/cal ${isPinned?(isConfItem?"bg-red-500/5 border-red-500/20":"bg-orange-500/5 border-orange-500/20"):"bg-slate-700/40 border-slate-600/30"}`}>

      </div>
    })}</div></div>}
  </div>
}

function ItineraryTab({selections,setSelections,dayPins,removePin,allItems,getDayDisplayItems,moveItem,hideActivity,restoreActivity,getHiddenItems,reminders,setReminders,newReminder,setNewReminder}){

    const totalConf=Object.values(allItems).filter(x=>x.themes?.includes("conference")).length;
    const pinnedConf=[...allPinned].filter(id=>allItems[id]?.themes?.includes("conference")).length;
    return{total:totalConf,pinned:pinnedConf,pct:totalConf>0?Math.round((pinnedConf/totalConf)*100):0}
  },[dayPins,allItems]);
  const maxConf=()=>setSelections(DAYS.map(d=>{let b=0;d.options.forEach((o,i)=>{if(o.themes.includes("conference"))b=i});return b}));
  const maxVibe=()=>setSelections(DAYS.map(d=>{let b=0,s=-1;d.options.forEach((o,i)=>{if(o.vibeScore>s){s=o.vibeScore;b=i}});return b}));
  const resetAll=()=>setSelections(DAYS.map(()=>0));

      <div className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/40 text-center"><div className="text-2xl font-bold text-amber-400">${stats.bLow}</div><div className="text-xs text-slate-500">Est. Low</div></div>
      <div className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/40 text-center"><div className="text-2xl font-bold text-amber-300">${stats.bHigh}</div><div className="text-xs text-slate-500">Est. High</div></div>
    </div>

    {(()=>{const lvl=vPct>=90?"LEGENDARY":vPct>=75?"EPIC":vPct>=60?"AWESOME":vPct>=45?"SOLID":vPct>=30?"CHILL":"MEH";const clr=vPct>=90?"from-red-500 via-orange-400 to-amber-300":vPct>=75?"from-orange-500 via-amber-400 to-yellow-300":vPct>=60?"from-amber-500 via-yellow-400 to-lime-300":vPct>=45?"from-emerald-500 via-teal-400 to-cyan-300":vPct>=30?"from-sky-500 via-blue-400 to-indigo-300":"from-slate-500 via-slate-400 to-slate-300";const txtClr=vPct>=90?"text-red-400":vPct>=75?"text-orange-400":vPct>=60?"text-amber-400":vPct>=45?"text-emerald-400":vPct>=30?"text-sky-400":"text-slate-400";const emoji=vPct>=90?"🔥🔥🔥":vPct>=75?"🔥🔥":vPct>=60?"🔥":vPct>=45?"✨":vPct>=30?"👌":"😴";
    const cp=confStats.pct;const cLvl=cp>=90?"ALL IN":cp>=70?"COMMITTED":cp>=50?"BALANCED":cp>=30?"SELECTIVE":"SKIPPING";const cClr=cp>=90?"from-red-500 via-rose-400 to-pink-300":cp>=70?"from-rose-500 via-pink-400 to-fuchsia-300":cp>=50?"from-purple-500 via-violet-400 to-indigo-300":cp>=30?"from-indigo-500 via-blue-400 to-cyan-300":"from-slate-500 via-slate-400 to-slate-300";const cTxtClr=cp>=90?"text-red-400":cp>=70?"text-rose-400":cp>=50?"text-purple-400":cp>=30?"text-indigo-400":"text-slate-400";const cEmoji=cp>=90?"🎤🎤🎤":cp>=70?"🎤🎤":cp>=50?"🎤":cp>=30?"👀":"🏖";
    return <div className="mb-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div className="bg-slate-800/60 rounded-xl p-4 border border-slate-700/30">

        <div className="w-full h-3 bg-slate-700/60 rounded-full overflow-hidden"><div className={`h-full rounded-full bg-gradient-to-r ${clr} transition-all duration-500`} style={{width:vPct+'%'}}/></div>
        <div className="flex justify-between mt-1.5"><span className="text-[10px] text-slate-600">Meh</span><span className="text-[10px] text-slate-600">Legendary</span></div>
      </div>
      <div className="bg-slate-800/60 rounded-xl p-4 border border-slate-700/30">
        <div className="flex items-center justify-between mb-2"><span className="text-xs text-slate-500">Conference Attendance</span><span className={`text-sm font-bold ${cTxtClr}`}>{cEmoji} {cLvl}</span></div>
        <div className="w-full h-3 bg-slate-700/60 rounded-full overflow-hidden"><div className={`h-full rounded-full bg-gradient-to-r ${cClr} transition-all duration-500`} style={{width:cp+'%'}}/></div>
        <div className="flex justify-between mt-1.5"><span className="text-[10px] text-slate-600">Skipping</span><span className="text-[10px] text-slate-600">{confStats.pinned}/{confStats.total} sessions</span></div>
      </div>
    </div>})()}

    <div className="space-y-3">
      {DAYS.map((day,i)=>{
        const opt=day.options[selections[i]]||day.options[0];
        const pins=(dayPins[i]||[]).filter(id=>allItems[id]);
        const exp=expandedDay===i;
        const displayItems=exp?getDayDisplayItems(i):[];
        return <div key={i} className={`bg-slate-800/80 rounded-xl border border-slate-700/60 overflow-hidden transition-all duration-300 border-l-4 ${rc[day.region]||"border-l-slate-600"}`}>

            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap"><span className="text-sm font-semibold text-white">{day.title}</span><span className="text-slate-600">—</span><span className="text-sm text-slate-300">{opt.title}</span>{pins.length>0&&<span className="text-xs text-orange-400 font-medium">+{pins.length} pinned</span>}</div>
              <div className="flex gap-1 mt-1 flex-wrap">{opt.themes.map(t=><ThemeTag key={t} theme={t}/>)}</div>
            </div>
            <div className="flex-shrink-0 flex items-center gap-3">
              <div className="hidden sm:block text-right"><div className="text-xs text-slate-500">Vibe</div><div className="text-sm font-bold text-violet-400">{opt.vibeScore}/10</div></div>
              <svg className={`w-5 h-5 text-slate-400 transition-transform ${exp?"rotate-180":""}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7"/></svg>
            </div>
          </button>
          {exp&&<div className="px-5 pb-5 border-t border-slate-700/40">
            {day.options.length>1&&<div className="flex gap-2 mt-4 mb-4 flex-wrap">{day.options.map((o,oi)=><button key={o.id} onClick={()=>{const n=[...selections];n[i]=oi;setSelections(n)}} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${oi===selections[i]?"bg-orange-600 text-white shadow-lg shadow-orange-600/20":"bg-slate-700/60 text-slate-300 hover:bg-slate-600/60"}`}><div>{o.title}</div><div className={`text-xs mt-0.5 ${oi===selections[i]?"text-orange-200":"text-slate-500"}`}>{o.subtitle}</div></button>)}</div>}
            <div className="flex gap-4 mb-4 flex-wrap text-xs items-center"><span className="text-slate-500">Vibe: <span className="font-bold text-violet-400">{opt.vibeScore}/10</span></span><span className="text-slate-500">Budget: <span className="font-bold text-amber-400">${opt.budgetLow}–${opt.budgetHigh}</span></span><span className="flex-1"/><button onClick={()=>setCalView(p=>({...p,[i]:!p[i]}))} className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-colors border ${calView[i]?"bg-sky-500/20 text-sky-400 border-sky-500/30":"bg-slate-700/60 text-slate-400 border-slate-600/30 hover:bg-slate-600/60"}`}>{calView[i]?"📋 List":"🗓 Calendar"}</button></div>
            {calView[i]?<DayCalendarView displayItems={displayItems} dayIndex={i} moveItem={moveItem} removePin={removePin} hideActivity={hideActivity}/>:<div className="space-y-3">{displayItems.map((item,idx)=>{
              const isPinned=item.type==='pin';

      <div className="px-5 py-3 border-b border-slate-700/30 flex items-center justify-between"><h3 className="text-sm font-semibold text-slate-300">📋 Pre-Trip Checklist</h3><span className="text-xs text-slate-500">{reminders.filter(r=>r.done).length}/{reminders.length}</span></div>

      <div className="px-5 py-3 border-t border-slate-700/30 flex gap-2"><input value={newReminder} onChange={e=>setNewReminder(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&newReminder.trim()){setReminders(p=>[...p,{id:"r-"+Date.now(),text:newReminder.trim(),done:false}]);setNewReminder("")}}} placeholder="Add a reminder..." className="flex-1 bg-slate-700 rounded-lg px-3 py-1.5 text-sm text-white placeholder-slate-500 border border-slate-600 focus:border-orange-500 outline-none"/><button onClick={()=>{if(newReminder.trim()){setReminders(p=>[...p,{id:"r-"+Date.now(),text:newReminder.trim(),done:false}]);setNewReminder("")}}} className="px-3 py-1.5 rounded-lg bg-slate-700 text-slate-400 text-xs font-medium hover:bg-slate-600 transition-colors">Add</button></div>
    </div>

    <div className="mt-6 bg-slate-800/60 rounded-xl p-5 border border-slate-700/30 text-sm text-slate-400 space-y-2">
      <p className="font-medium text-slate-300">Planning Tips</p>
      <p>🌡 <strong className="text-slate-300">Weather</strong> — April in Atlanta: 55-78°F, occasional showers. Layers + light rain jacket.</p>
      <p>🚇 <strong className="text-slate-300">MARTA</strong> — Airport to Midtown in 20 min for $2.50. Rideshare for off-rail neighborhoods.</p>
      <p>🎤 <strong className="text-slate-300">UX360</strong> — SCADshow is a 10-min walk from Canopy by Hilton. 1470 Spring St NW.</p>
      <p>👟 <strong className="text-slate-300">Walking</strong> — Conference + BeltLine + neighborhoods = 12k+ steps/day.</p>
    </div>
  </>
}

function LibraryTab({library,setLibrary,pinToDay,dayPins}){

      <textarea value={form.desc} onChange={e=>setForm(p=>({...p,desc:e.target.value}))} placeholder="Description" rows={2} className="w-full bg-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 border border-slate-600 focus:border-emerald-500 outline-none resize-none"/>

    </div>}
    <div className="flex gap-1.5 mb-4 flex-wrap">

      <div className="flex gap-1 mt-2 flex-wrap">{(item.themes||[]).map(t=><ThemeTag key={t} theme={t}/>)}</div>
    </div><div className="flex items-center gap-2 flex-shrink-0"><DayPicker onSelect={di=>pinToDay(di,item.id)}/>{item.id.startsWith("a-")&&<button onClick={()=>removeItem(item.id)} className="text-slate-600 hover:text-red-400 transition-colors text-sm">✕</button>}</div></div></div>})}</div>
    {filtered.length===0&&<p className="text-center text-slate-600 py-8 text-sm">No activities match this filter.</p>}
  </>
}

// ─── Food Tab ───
function FoodTab({food,setFood,pinToDay,dayPins}){
  const [fr,setFr]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({name:"",desc:"",region:"midtown",price:"$$",proximity:100,themes:["food"]});
  const pinnedIds=useMemo(()=>{const s=new Set();Object.values(dayPins).forEach(a=>a.forEach(id=>s.add(id)));return s},[dayPins]);
  const regions=[...new Set(food.map(f=>f.region))];
  const filtered=fr?food.filter(f=>f.region===fr):food;
  const grouped={};filtered.forEach(f=>{if(!grouped[f.region])grouped[f.region]=[];grouped[f.region].push(f)});
  const removeItem=id=>setFood(p=>p.filter(x=>x.id!==id));
  const addItem=()=>{if(!form.name.trim())return;setFood(p=>[...p,{...form,id:"f-"+Date.now(),themes:["food"]}]);setForm({name:"",desc:"",region:"midtown",price:"$$",proximity:100,themes:["food"]});setShowForm(false)};

  return <>
    <div className="flex items-center justify-between mb-4"><h2 className="text-lg font-semibold text-white">🍗 Food Guide</h2><button onClick={()=>setShowForm(!showForm)} className="px-3 py-1.5 rounded-lg bg-orange-600 text-white text-xs font-medium hover:bg-orange-500 transition-colors">{showForm?"Cancel":"+ Add Food"}</button></div>
    <p className="text-sm text-slate-400 mb-4">Food wishlist by neighborhood. Proximity shows distance from Midtown.</p>
    {showForm&&<div className="bg-slate-800/80 rounded-xl border border-orange-500/30 p-4 mb-4 space-y-3">
      <input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="Food / Restaurant name" className="w-full bg-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 border border-slate-600 focus:border-orange-500 outline-none"/>
      <textarea value={form.desc} onChange={e=>setForm(p=>({...p,desc:e.target.value}))} placeholder="Notes" rows={2} className="w-full bg-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 border border-slate-600 focus:border-orange-500 outline-none resize-none"/>
      <div className="flex gap-4 flex-wrap"><div><label className="text-xs text-slate-500 block mb-1">Region</label><select value={form.region} onChange={e=>setForm(p=>({...p,region:e.target.value}))} className="bg-slate-700 rounded-lg px-3 py-1.5 text-sm text-white border border-slate-600">{REGIONS.map(r=><option key={r} value={r}>{REGION_LABELS[r]}</option>)}</select></div><div><label className="text-xs text-slate-500 block mb-1">Price</label><select value={form.price} onChange={e=>setForm(p=>({...p,price:e.target.value}))} className="bg-slate-700 rounded-lg px-3 py-1.5 text-sm text-white border border-slate-600"><option value="$">$ Budget</option><option value="$$">$$ Mid</option><option value="$$$">$$$ Splurge</option></select></div><div><label className="text-xs text-slate-500 block mb-1">Proximity %</label><input type="number" min={0} max={100} value={form.proximity} onChange={e=>setForm(p=>({...p,proximity:+e.target.value}))} className="w-20 bg-slate-700 rounded-lg px-3 py-1.5 text-sm text-white border border-slate-600"/></div></div>
      <button onClick={addItem} className="px-4 py-2 rounded-lg bg-orange-600 text-white text-sm font-medium hover:bg-orange-500 transition-colors">Add to Guide</button>
    </div>}
    <div className="flex gap-1.5 mb-5 flex-wrap">
      <button onClick={()=>setFr(null)} className={`px-2.5 py-1 rounded-full text-xs font-medium ${!fr?"bg-white text-slate-900":"bg-slate-700/60 text-slate-400 hover:bg-slate-600/60"}`}>All</button>
      {regions.map(r=><button key={r} onClick={()=>setFr(fr===r?null:r)} className={`px-2.5 py-1 rounded-full text-xs font-medium ${fr===r?"bg-orange-500/20 text-orange-400 border border-orange-500/30":"bg-slate-700/60 text-slate-400 hover:bg-slate-600/60"}`}>{REGION_LABELS[r]||r}</button>)}
    </div>
    {Object.entries(grouped).map(([region,items])=><div key={region} className="mb-6"><h3 className="text-sm font-semibold text-slate-300 mb-2 flex items-center gap-2"><span className="text-orange-400">🍗</span> {REGION_LABELS[region]||region} <span className="text-xs text-slate-600">({items.length})</span></h3><div className="space-y-2">{items.map(item=>{const pinned=pinnedIds.has(item.id);return <div key={item.id} className={`rounded-xl border p-4 ${pinned?"bg-emerald-500/10 border-emerald-500/30":"bg-slate-800/80 border-slate-700/40"}`}><div className="flex items-start gap-3"><div className="flex-1 min-w-0">
      <div className="flex items-center gap-2 flex-wrap"><span className="text-sm font-semibold text-white">{item.name}</span>{pinned&&<span className="text-[10px] text-emerald-400 font-medium px-1.5 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">PINNED</span>}<PriceTag price={item.price}/><ProximityBadge value={item.proximity}/></div>
      <p className="text-xs text-slate-400 mt-1">{item.desc}</p>
      {item.themes&&<div className="flex gap-1 mt-2 flex-wrap">{item.themes.map(t=><ThemeTag key={t} theme={t}/>)}</div>}
    </div><div className="flex items-center gap-2 flex-shrink-0"><DayPicker onSelect={di=>pinToDay(di,item.id)} label="📌 Pin"/>{item.id.startsWith("f-")&&<button onClick={()=>removeItem(item.id)} className="text-slate-600 hover:text-red-400 transition-colors text-sm">✕</button>}</div></div></div>})}</div></div>)}
    {filtered.length===0&&<p className="text-center text-slate-600 py-8 text-sm">No food items match.</p>}
  </>
}

// ─── Conference Tab ───
function ConferenceTab({conference,setConference,pinToDay,removePin,dayPins}){
  const [typeFilter,setTypeFilter]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({name:"",desc:"",day:"wed",time:"09:00–10:00",type:"presentation",interestScore:5});
  const pinnedIds=useMemo(()=>{const s=new Set();Object.values(dayPins).forEach(a=>a.forEach(id=>s.add(id)));return s},[dayPins]);

  const types=[...new Set(conference.map(c=>c.type))];
  const filtered=typeFilter?conference.filter(c=>c.type===typeFilter):conference;
  const byDay={tue:[],wed:[],thu:[]};filtered.forEach(e=>{if(byDay[e.day])byDay[e.day].push(e)});

  const removeItem=id=>setConference(p=>p.filter(x=>x.id!==id));
  const addItem=()=>{if(!form.name.trim())return;setConference(p=>[...p,{...form,id:"c-"+Date.now(),themes:["conference"]}]);setForm({name:"",desc:"",day:"wed",time:"09:00–10:00",type:"presentation",interestScore:5});setShowForm(false)};

  const dayLabels={tue:"Tue Apr 21 — Pre-Conference",wed:"Wed Apr 22 — Day 1",thu:"Thu Apr 23 — Day 2"};
  const dayIdx={tue:0,wed:1,thu:2};

  return <>
    <div className="flex items-center justify-between mb-4"><h2 className="text-lg font-semibold text-white">🎤 UX360 Conference</h2><button onClick={()=>setShowForm(!showForm)} className="px-3 py-1.5 rounded-lg bg-red-600 text-white text-xs font-medium hover:bg-red-500 transition-colors">{showForm?"Cancel":"+ Add Event"}</button></div>
    <p className="text-sm text-slate-400 mb-4">Full conference schedule. Pin sessions to your itinerary days. Interest score rates relevance for a UX designer.</p>
    {showForm&&<div className="bg-slate-800/80 rounded-xl border border-red-500/30 p-4 mb-4 space-y-3">
      <input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="Event name" className="w-full bg-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 border border-slate-600 focus:border-red-500 outline-none"/>
      <textarea value={form.desc} onChange={e=>setForm(p=>({...p,desc:e.target.value}))} placeholder="Description" rows={2} className="w-full bg-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 border border-slate-600 focus:border-red-500 outline-none resize-none"/>
      <div className="flex gap-3 flex-wrap">
        <div><label className="text-xs text-slate-500 block mb-1">Day</label><select value={form.day} onChange={e=>setForm(p=>({...p,day:e.target.value}))} className="bg-slate-700 rounded-lg px-3 py-1.5 text-sm text-white border border-slate-600"><option value="tue">Tue (Pre)</option><option value="wed">Wed (Day 1)</option><option value="thu">Thu (Day 2)</option></select></div>
        <div><label className="text-xs text-slate-500 block mb-1">Time</label><input value={form.time} onChange={e=>setForm(p=>({...p,time:e.target.value}))} className="w-32 bg-slate-700 rounded-lg px-3 py-1.5 text-sm text-white border border-slate-600 focus:border-red-500 outline-none"/></div>
        <div><label className="text-xs text-slate-500 block mb-1">Type</label><select value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))} className="bg-slate-700 rounded-lg px-3 py-1.5 text-sm text-white border border-slate-600"><option value="presentation">Presentation</option><option value="keynote">Keynote</option><option value="panel">Panel</option><option value="networking">Networking</option></select></div>
        <div><label className="text-xs text-slate-500 block mb-1">Interest</label><input type="number" min={1} max={10} value={form.interestScore} onChange={e=>setForm(p=>({...p,interestScore:+e.target.value}))} className="w-16 bg-slate-700 rounded-lg px-3 py-1.5 text-sm text-white border border-slate-600"/></div>
      </div>
      <button onClick={addItem} className="px-4 py-2 rounded-lg bg-red-600 text-white text-sm font-medium hover:bg-red-500 transition-colors">Add Event</button>
    </div>}
    <div className="flex gap-1.5 mb-5 flex-wrap">
      <button onClick={()=>setTypeFilter(null)} className={`px-2.5 py-1 rounded-full text-xs font-medium ${!typeFilter?"bg-white text-slate-900":"bg-slate-700/60 text-slate-400 hover:bg-slate-600/60"}`}>All</button>
      {types.map(t=><button key={t} onClick={()=>setTypeFilter(typeFilter===t?null:t)} className={`px-2.5 py-1 rounded-full text-xs font-medium capitalize ${typeFilter===t?"bg-red-500/20 text-red-400 border border-red-500/30":"bg-slate-700/60 text-slate-400 hover:bg-slate-600/60"}`}>{t}</button>)}
    </div>
    {["tue","wed","thu"].map(day=>{const items=byDay[day];if(!items||items.length===0)return null;return <div key={day} className="mb-6">
      <h3 className="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2"><span className="text-red-400">🎤</span> {dayLabels[day]} <span className="text-xs text-slate-600">({items.length})</span></h3>
      <div className="space-y-2">{items.map(event=>{const pinned=pinnedIds.has(event.id);return <div key={event.id} className={`rounded-xl border p-4 transition-colors ${pinned?"bg-emerald-500/10 border-emerald-500/30 hover:border-emerald-500/50":"bg-slate-800/80 border-red-500/20 hover:border-red-500/40"}`}><div className="flex items-start gap-3"><div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap mb-1"><TypeBadge type={event.type}/><InterestBadge value={event.interestScore}/><span className="text-xs font-mono text-slate-500">{event.time}</span>{pinned&&<span className="text-[10px] text-emerald-400 font-medium px-1.5 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">PINNED</span>}</div>
        <div className="text-sm font-semibold text-white">{event.name}</div>
        <p className="text-xs text-slate-400 mt-1">{event.desc}</p>
      </div><div className="flex items-center gap-2 flex-shrink-0">{pinned?<button onClick={()=>removePin(dayIdx[day],event.id)} className="px-3 py-1.5 rounded-lg bg-emerald-600/20 text-emerald-400 text-xs font-medium hover:bg-red-500/20 hover:text-red-400 transition-colors border border-emerald-500/30 hover:border-red-500/30">✓ Attending</button>:<button onClick={()=>pinToDay(dayIdx[day],event.id)} className="px-3 py-1.5 rounded-lg bg-red-500/20 text-red-300 text-xs font-medium hover:bg-red-500/30 transition-colors border border-red-500/30">+ Attend</button>}{event.id.startsWith("c-")&&<button onClick={()=>removeItem(event.id)} className="text-slate-600 hover:text-red-400 transition-colors text-sm">✕</button>}</div></div></div>})}</div>
    </div>})}
  </>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
